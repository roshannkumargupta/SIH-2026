<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logo Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0A1420;
      color: #E8ECEF;
      font-family: 'Atkinson Hyperlegible', sans-serif;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      align-items: center;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .emblem {
      height: 48px;
      filter: drop-shadow(0 2px 10px rgba(245, 199, 126, 0.3));
    }
    .text-block {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 24px;
      font-weight: 700;
      color: #F5C77E;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      color: #8EA6BC;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      line-height: 1.15;
      margin-top: 2px;
    }
    .card {
      background: #0E1A26;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px 32px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="/assets/brand-lockup-transparent.png" class="emblem" style="height: 52px;" alt="SmritiSetu Emblem">
    </div>
  </div>
</body>
</html>
